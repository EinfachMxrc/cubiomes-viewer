name: Build and Release

on:
  push:
    branches: [trunk, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  golden-tests:
    name: Golden tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run golden tests
        run: |
          chmod +x tests/golden/run.sh
          tests/golden/run.sh

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: golden-tests
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev qtbase5-dev qt5-qmake qttools5-dev-tools
      - name: Build
        run: |
          qmake cubiomes-viewer.pro CONFIG+=release
          make -j$(nproc)
      - name: Package
        run: |
          bin=cubiomes-viewer
          [ -f "$bin" ] || bin=bin/cubiomes-viewer
          tar -czf cubiomes-viewer-linux.tar.gz "$bin" README.md LICENSE docs/support-matrix.md
      - uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-linux
          path: cubiomes-viewer-linux.tar.gz

  build-windows:
    name: Build (Windows, MinGW)
    runs-on: windows-latest
    needs: golden-tests
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Qt 6 + its bundled MinGW 11 (GCC 11 supports the C23 constructs the
      # cubiomes fork uses; MSVC does not compile this library).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: 'tools_mingw1310'
          archives: 'qtbase qttools'
      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          $mingw = Get-ChildItem "${env:RUNNER_WORKSPACE}\Qt\Tools" -Directory |
                   Where-Object Name -like 'mingw*' | Select-Object -First 1
          "$($mingw.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build
        shell: cmd
        run: |
          qmake cubiomes-viewer.pro CONFIG+=release
          mingw32-make -j2
      - name: Package with Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item release\cubiomes-viewer.exe dist\
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist\cubiomes-viewer.exe
          Copy-Item README.md, LICENSE dist\
          Copy-Item docs\support-matrix.md dist\
          Compress-Archive -Path dist\* -DestinationPath cubiomes-viewer-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-windows
          path: cubiomes-viewer-windows.zip

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum cubiomes-viewer-*.tar.gz cubiomes-viewer-*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cubiomes-viewer-linux.tar.gz
            cubiomes-viewer-windows.zip
            SHA256SUMS.txt
